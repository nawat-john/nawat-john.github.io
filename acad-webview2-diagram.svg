<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono',monospace">
  <rect x="0" y="0" width="900" height="560" fill="#2b2b30"/>

  <!-- title bar -->
  <rect x="0" y="0" width="900" height="30" fill="#1f1f23"/>
  <circle cx="18" cy="15" r="5" fill="#e8478a"/>
  <circle cx="36" cy="15" r="5" fill="#e0b34f"/>
  <circle cx="54" cy="15" r="5" fill="#5fb87a"/>
  <text x="450" y="19" fill="#c9c3ba" font-size="12" text-anchor="middle">AutoCAD 2026 — Drawing1.dwg</text>

  <!-- ribbon tabs -->
  <rect x="0" y="30" width="900" height="26" fill="#232327"/>
  <text x="20" y="48" fill="#9c968d" font-size="11">Home</text>
  <text x="70" y="48" fill="#9c968d" font-size="11">Insert</text>
  <text x="122" y="48" fill="#9c968d" font-size="11">Annotate</text>
  <text x="188" y="48" fill="#9c968d" font-size="11">View</text>
  <rect x="230" y="30" width="70" height="26" fill="#e8478a"/>
  <text x="265" y="48" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Add-ins</text>

  <!-- ribbon panel for the add-in -->
  <rect x="0" y="56" width="900" height="64" fill="#2b2b30"/>
  <rect x="16" y="64" width="130" height="48" rx="6" fill="#38383f" stroke="#e8478a" stroke-width="1.5"/>
  <text x="81" y="84" fill="#f3efe8" font-size="12" font-weight="700" text-anchor="middle">Open WebView</text>
  <text x="81" y="100" fill="#9c968d" font-size="9" text-anchor="middle">hehe panel</text>
  <text x="16" y="130" fill="#6f6a62" font-size="10">Add-ins ▸ hehe</text>

  <!-- drawing canvas -->
  <rect x="0" y="132" width="900" height="428" fill="#1c1c1f"/>
  <g stroke="#4a4a52" stroke-width="1.5" fill="none">
    <rect x="60" y="200" width="360" height="300"/>
    <line x1="60" y1="320" x2="420" y2="320"/>
    <line x1="240" y1="200" x2="240" y2="320"/>
  </g>
  <text x="60" y="188" fill="#5c5750" font-size="10">floor plan (drawing area)</text>

  <!-- docked webview panel, topmost -->
  <g>
    <rect x="470" y="170" width="380" height="320" rx="8" fill="#f6f1ea" stroke="#e8478a" stroke-width="2"/>
    <rect x="470" y="170" width="380" height="30" rx="8" fill="#e8478a"/>
    <rect x="470" y="185" width="380" height="15" fill="#e8478a"/>
    <text x="486" y="190" fill="#fff" font-size="11" font-weight="700">WebView2 — docked browser</text>
    <rect x="486" y="208" width="348" height="20" rx="4" fill="#fff" stroke="#d8d0c4"/>
    <text x="494" y="222" fill="#8a8378" font-size="9">https://…</text>
    <rect x="486" y="238" width="348" height="230" rx="4" fill="#fff" stroke="#e8e2d8"/>
    <text x="660" y="360" fill="#c8c0b3" font-size="11" text-anchor="middle">(browser content)</text>
  </g>
  <text x="660" y="500" fill="#9c968d" font-size="10" text-anchor="middle">stays TopMost — browse without leaving AutoCAD</text>

  <!-- footer badge -->
  <rect x="0" y="532" width="900" height="28" fill="#1f1f23"/>
  <text x="450" y="550" fill="#7a7468" font-size="10" text-anchor="middle">Concept diagram — not an actual screenshot</text>
</svg>
